<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123524">
<title>Josh United</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 60 L4 44 V6 h56 v38z' fill='%23f2c14b'/%3E%3Ctext x='32' y='34' text-anchor='middle' font-family='sans-serif' font-size='16' font-weight='700' fill='%233a2502'%3EJU%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ink: #e8eaf4;
    --muted: #a3abc2;
    --cream: #12141c;
    --card: #1c2030;
    --line: #32384c;
    --green: #3ddc84;
    --green-d: #149654;
    --gold: #f2c14b;
    --gold-ink: #3a2502;
    --navy: #10131c;
    --bad: #ff6b6b;
    --font: "Avenir Next", "Segoe UI", "Trebuchet MS", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; max-width: 100%; overflow-x: hidden; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: #0e1018;
    min-height: 100dvh;
    height: 100dvh;
  }
  button, input { font: inherit; }
  button {
    border: 0;
    cursor: pointer;
    border-radius: 999px;
    padding: 10px 14px;
    background: var(--green);
    color: white;
    font-weight: 750;
    font-weight: 700;
    min-height: 44px;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary { background: #2a3148; color: var(--ink); }
  button.ghost { background: transparent; color: inherit; min-height: 36px; padding: 6px 10px; }
  button.danger { background: var(--bad); }
  button.small { min-height: 36px; padding: 6px 10px; font-size: 13px; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #app {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    height: 100dvh;
    max-height: 100dvh;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--cream);
    box-shadow: 0 0 0 1px rgba(0,0,0,.05);
  }
  header.top {
    background: #161822;
    color: #f6f3ea;
    padding: 6px 8px;
    flex: none;
    z-index: 15;
    border-bottom: 1px solid #2a3144;
    padding-top: calc(6px + env(safe-area-inset-top));
  }
  .topbar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; width: 100%; min-width: 0; }
  .topbar .stat { font-size: 11px; font-weight: 800; background: #242838; border-radius: 999px; padding: 3px 7px; white-space: nowrap; }
  .iconbtn { min-height: 32px; min-width: 32px; padding: 2px 7px; border-radius: 12px; background: #242838; color: #f6f3ea; font-size: 13px; }
  .iconbtn.on { background: var(--gold); color: var(--gold-ink); }
  .idrow { display: flex; gap: 10px; align-items: center; }
  .crest {
    width: 32px; height: 36px; flex: none;
    background: linear-gradient(#ffe08a, #e0a31a);
    clip-path: polygon(50% 100%, 0 74%, 0 0, 100% 0, 100% 74%);
    display: grid; place-items: center;
    color: var(--gold-ink); font-weight: 800; font-size: 13px;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -.3px; }
  .sub { margin: 2px 0 0; font-size: 13px; color: #d5ecdc; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
  .pill {
    background: rgba(255,255,255,.14);
    border-radius: 999px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 700;
  }
  .pill.hot { background: var(--gold); color: var(--gold-ink); }
  .seg { display: inline-flex; background: rgba(0,0,0,.25); border-radius: 999px; padding: 2px; }
  .seg button { min-height: 30px; padding: 4px 10px; background: transparent; color: #f6f3ea; font-size: 12px; }
  .seg button.on { background: white; color: var(--green-d); }
  main {
    flex: 1 1 auto;
    min-height: 0;
    min-width: 0;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 12px;
    box-shadow: 0 8px 24px rgba(20,32,51,.06);
  }
  .card h2 { margin: 0 0 8px; font-size: 16px; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .board {
    background: var(--navy);
    color: white;
    border-radius: 18px;
    padding: 14px;
  }
  .kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #f2c14b; font-weight: 800; }
  .score {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    align-items: center;
    margin-top: 6px;
  }
  .score .n { font-size: 42px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .score .who { font-size: 13px; font-weight: 700; margin-top: 2px; }
  .side-r { text-align: right; }
  .dash { color: #f2c14b; font-weight: 800; font-size: 34px; line-height: 1; }
  .odds { margin-top: 8px; font-size: 12px; color: #c9d4e4; }
  .printer {
    margin-top: 10px;
    background: #07140e;
    color: #b7f7c8;
    font-family: var(--mono);
    border-radius: 12px;
    min-height: 148px;
    max-height: 210px;
    overflow: auto;
    padding: 10px 12px;
    font-size: 13.5px;
    line-height: 1.45;
  }
  .printer .us { color: #8dffb0; font-weight: 700; }
  .printer .them { color: #ffb4b4; font-weight: 700; }
  .printer .ft { color: #ffe08a; }
  .blink {
    display: inline-block; width: 8px; height: 13px; background: #b7f7c8;
    margin-left: 4px; vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .form { display: flex; gap: 4px; margin-top: 8px; }
  .form i {
    width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
    font-style: normal; font-size: 11px; font-weight: 800; color: white;
  }
  .form .W { background: #1f8a4c; }
  .form .D { background: #c2880c; }
  .form .L { background: #b42318; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 4px; text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-size: 11px; font-weight: 700; }
  td.club, th.club { text-align: left; white-space: normal; }
  tr.us td { background: #1e3d2c; font-weight: 700; color: #d8ffe6; }
  .gdpos { color: #1f8a4c; }
  .gdneg { color: #b42318; }
  .table-wrap { overflow-x: auto; }
  .pitch {
    background: repeating-linear-gradient(90deg, #1f8a45 0 26px, #18763b 26px 52px);
    border-radius: 18px;
    padding: 10px 8px 14px;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.35);
  }
  .prow { display: flex; gap: 6px; justify-content: center; margin: 6px 0; }
  .slot {
    background: rgba(255,255,255,.95);
    border: 0;
    border-radius: 12px;
    min-height: 62px;
    padding: 4px;
    color: #142033;
    text-align: center;
    position: relative;
  }
  .prow.fwd .slot { flex: 0 1 46%; }
  .prow.mid .slot, .prow.def .slot { flex: 1 1 0; }
  .prow.gk { justify-content: center; }
  .prow.gk .slot { flex: 0 1 46%; }
  .slot .pos { font-size: 9px; letter-spacing: .08em; color: var(--muted); font-weight: 800; }
  .slot .rt { font-size: 16px; font-weight: 800; line-height: 1.1; }
  .slot .nm { font-size: 10px; line-height: 1.15; font-weight: 700; overflow-wrap: anywhere; }
  .slot.gold { box-shadow: inset 0 0 0 2px #e0a31a; background: linear-gradient(#fff, #fff6d8); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border-radius: 999px; padding: 6px 10px; min-height: 34px;
    background: #e7e1d4; color: var(--ink); font-size: 12px; font-weight: 700;
  }
  .chip.on { background: var(--green); color: white; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 480px) {
    .stickers { grid-template-columns: repeat(3, 1fr); }
  }
  .pcard {
    background: var(--card); border-radius: 14px; padding: 10px;
    border: 2px solid var(--line); text-align: left; color: inherit; width: 100%;
  }
  .pcard .top { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
  .pcard .rt { font-size: 22px; font-weight: 800; }
  .pcard .nm { font-weight: 800; font-size: 14px; }
  .tag { font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  .goldtag { color: #8a6508; }
  .bar { height: 6px; background: #efe8d6; border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar span { display: block; height: 100%; background: var(--green); }
  .uncaught { opacity: .55; filter: grayscale(.35); }
  .stickers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sticker {
    background: var(--card); border-radius: 12px; min-height: 92px; padding: 8px;
    border: 2px solid var(--line); font-size: 12px;
  }
  .sticker b { display: block; font-size: 12px; line-height: 1.25; }
  .banner {
    border-radius: 14px; padding: 10px 12px; background: #e7f6ec; font-weight: 700;
  }
  .banner.bad { background: #fde8e8; }
  .banner.gold { background: linear-gradient(#fff6d0, #ffe08a); }
  .exact { font-size: 18px; margin: 0 0 4px; }
  .tabs {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: min(520px, 100%);
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: #fffdf8; border-top: 1px solid var(--line);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .tabs button {
    background: transparent; color: var(--muted); border-radius: 12px;
    padding: 6px 2px; font-size: 11px; min-height: 46px; line-height: 1.15;
  }
  .tabs button.on { background: #2a3148; color: white; }
  .dock {
    position: relative;
    flex: none;
    width: 100%;
    display: flex; gap: 2px; align-items: stretch;
    background: #161822; border-top: 1px solid #2a3144;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .dock button {
    flex: 1 1 0;
    min-width: 0;
    background: transparent; color: #a3abc2; border-radius: 12px;
    min-height: 48px; padding: 4px 0; font-size: 9px; line-height: 1.1;
    display: grid; place-items: center; gap: 1px;
  }
  .dock button.on { background: #2a3148; color: white; }
  .dock .play {
    flex: 1.35; background: #e23b3b; color: white; font-size: 13px; font-weight: 900;
    letter-spacing: .04em; border-radius: 14px;
  }
  .dock .play.on { background: #ff4d4d; }
  .backdrop, .modal-back {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(10, 20, 16, .62);
    display: grid; place-items: end center;
    padding: 12px;
  }
  .modal-back { place-items: center; }
  .sheet, .modal {
    width: min(480px, 100%);
    background: var(--card);
    border-radius: 22px 22px 16px 16px;
    padding: 16px;
    max-height: min(78dvh, 640px);
    overflow: auto;
    position: relative;
  }
  .modal { text-align: center; border-radius: 22px; background: #fffdf8; color: #142033; }
  .sheet { color: var(--ink); }
  .modal.big { background: radial-gradient(circle at 50% 0%, #ffe7a3, #fffdf8 58%); }
  .modal h2 { font-size: 32px; line-height: 1.05; margin: 0 0 8px; letter-spacing: -.4px; }
  .list { display: grid; gap: 8px; }
  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti i {
    position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px;
    animation: fall 1.6s linear infinite;
  }
  @keyframes fall { to { transform: translateY(70vh) rotate(180deg); } }
  details { font-size: 13px; }
  summary { cursor: pointer; font-weight: 700; }
  .warn { background: #3a3218; color: #ffe7a3; border-radius: 12px; padding: 8px 10px; font-size: 13px; }
  .modal .muted { color: #5c6b7a; }
  .meter { height: 10px; background: #efe8d6; border-radius: 99px; overflow: hidden; }
  .meter span { display: block; height: 100%; background: linear-gradient(90deg, #e0a31a, #f2c14b); }
  @media (max-width: 380px) {
    .hide-sm { display: none; }
  }
  .match-wrap { display: grid; gap: 12px; }
  .board { position: relative; }
  .board.venue-home { box-shadow: inset 0 0 0 2px #1f8a4c; }
  .board.venue-away { box-shadow: inset 0 0 0 2px #7ea2ff; }
  .ha-pill {
    display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 99px;
    font-size: 10px; letter-spacing: .04em; background: rgba(255,255,255,.16);
  }
  .venue-home .ha-pill { background: #1f8a4c; }
  .venue-away .ha-pill { background: #2a4d9a; }
  .strip {
    position: absolute; left: 12px; right: 12px; top: 46%; height: 36px; border-radius: 10px;
    background: rgba(0,0,0,.18); overflow: hidden;
  }
  .strip .net {
    position: absolute; top: 3px; width: 10px; height: 20px; border: 2px solid rgba(255,255,255,.8);
  }
  .strip .net.l { left: 4px; border-right: 0; }
  .strip .net.r { right: 4px; border-left: 0; }
  .ball {
    position: absolute; top: 8px; left: 50%; width: 16px; height: 16px; margin-left: -8px;
    border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #d0d0d0 55%, #9a9a9a);
    box-shadow: 0 1px 2px rgba(0,0,0,.45);
    transition: left .45s ease;
  }
  .burst {
    position: absolute; left: 50%; top: 42px; transform: translateX(-50%);
    font-weight: 900; letter-spacing: .08em; font-size: 22px; pointer-events: none;
  }
  .burst.us { color: #b6ffcf; text-shadow: 0 0 12px #1f8a4c; animation: burst .7s ease; }
  .burst.them { color: #ffb4b4; animation: burst .45s ease; }
  .board.shake { animation: shake .4s linear; }
  .printer .pop { animation: popin .35s ease both; }
  .score .n.tick { animation: tick .35s ease; display: inline-block; }
  .ft-pop { text-align: center; color: #ffe08a; font-weight: 800; margin: 6px 0 0; animation: popin .4s ease; }
  .route-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .route-scroller { grid-area: stops; min-width: 0; width: 100%; overflow: hidden; }
  .route { display: flex; gap: 6px; align-items: flex-end; width: 100%; justify-content: space-between; }
  .route.slide { animation: routeSlide .42s ease; }
  .dot {
    position: relative;
    flex: 1 1 0;
    max-width: 52px;
    min-width: 0;
    height: 36px;
    border-radius: 8px;
    font-size: 9px;
    font-weight: 800;
    display: grid;
    place-items: center;
    line-height: 1;
  }
  .dot.home { background: #e5f6ea; color: #0e4a28; }
  .dot.away { background: #e4ebfb; color: #1d3f86; }
  .dot.W { box-shadow: inset 0 -4px 0 #1f8a4c; }
  .dot.D { box-shadow: inset 0 -4px 0 #c2880c; }
  .dot.L { box-shadow: inset 0 -4px 0 #b42318; }
  .dot.now { animation: pulse 1.1s ease-in-out infinite; }
  .dot.now::before, .dot.now::after {
    content: ""; position: absolute; top: 2px; bottom: 2px; width: 5px; pointer-events: none;
    border-top: 2px solid #f2c14b; border-bottom: 2px solid #f2c14b;
  }
  .dot.now::before { left: 1px; border-left: 2px solid #f2c14b; }
  .dot.now::after { right: 1px; border-right: 2px solid #f2c14b; }
  .dot.arrive { animation: routeHop .45s ease, pulse 1.1s ease-in-out .45s infinite; }
  .rest-pip { position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: #7a3ff0; }
  .party details { background: var(--card); border-radius: 18px; padding: 8px 10px 10px; }
  .party summary { font-weight: 800; cursor: pointer; }
  .prow-xi { display: grid; gap: 6px; margin-top: 8px; }
  .xi-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 6px; align-items: center; font-size: 12px; }
  .xi-row .pos { font-size: 9px; font-weight: 800; color: var(--muted); }
  .xi-row .nm { font-weight: 800; }
  .xp { height: 5px; background: #efe8d6; border-radius: 99px; overflow: hidden; margin-top: 3px; }
  .xp i { display: block; height: 100%; background: #1f8a4c; width: 0; transition: width .6s ease; }
  .lvl { color: #b6ffcf; font-weight: 800; animation: popin .45s ease; font-size: 9px; }
  .cap-badge { font-size: 9px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #8a6508; }
  .new-dot { font-size: 9px; font-weight: 800; background: #f2c14b; color: #3a2502; border-radius: 99px; padding: 1px 5px; }
  .chest-card { text-align: center; animation: popin .35s ease; }
  .chest-card .nm { font-size: 22px; font-weight: 800; margin: 4px 0; }
  .sil {
    min-height: 96px; border-radius: 12px; background: #2a3144; color: #8b93a0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-weight: 800; letter-spacing: .08em; padding: 8px;
  }
  .goldcard { position: relative; overflow: hidden; background: linear-gradient(#fff, #fff6d4); }
  .goldcard::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.7) 48%, transparent 62%);
    animation: sheen 2.4s linear infinite;
  }
  .div-block { margin-top: 4px; }
  .div-block h3 { margin: 12px 0 6px; font-size: 15px; }
  @keyframes popin { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes tick { 40% { transform: scale(1.22); color: #f2c14b; } }
  @keyframes shake { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-2px); } 80% { transform: translateX(2px); } }
  @keyframes burst { 0% { opacity: 0; transform: translateX(-50%) scale(.6); } 30% { opacity: 1; transform: translateX(-50%) scale(1.08); } 100% { opacity: 0; transform: translateX(-50%) scale(1); } }
  @keyframes pulse { 50% { transform: translateY(-2px); } }
  @keyframes routeSlide { from { transform: translateX(16%); } to { transform: translateX(0); } }
  @keyframes routeHop { 0% { transform: translateY(5px); } 45% { transform: translateY(-8px); } 100% { transform: translateY(0); } }
  @keyframes sheen { from { transform: translateX(-60%); } to { transform: translateX(60%); } }
  .spd-fast .pop, .spd-fast .tick, .spd-fast .burst, .spd-fast .board.shake, .spd-fast .ft-pop, .spd-fast .lvl, .spd-fast .chest-card { animation-duration: .08s; }
  .spd-fast .ball, .spd-fast .xp i { transition-duration: .06s; }
  .spd-fast .dot.now, .spd-fast .goldcard::after { animation: none; }
  .spd-fast .route.slide, .spd-fast .dot.arrive { animation-duration: .12s; }
  .stage {
    display: grid; grid-template-columns: 64px minmax(0, 1fr);
    flex: 1 1 auto;
    min-height: 220px;
    width: 100%;
    max-width: 100%;
    border-radius: 18px; overflow: hidden; background: #163824; position: relative;
  }
  .party-col {
    display: flex; flex-direction: column; gap: 4px; padding: 4px;
    background: rgba(8,16,12,.45); overflow-x: hidden; overflow-y: auto;
    min-height: 0; -webkit-overflow-scrolling: touch;
  }
  .mini {
    flex: 0 0 auto;
    box-sizing: border-box;
    border: 2px solid transparent; border-radius: 10px; background: #1c2436; color: white;
    padding: 3px 3px 4px; text-align: center; min-height: 46px;
    display: flex; flex-direction: column; justify-content: center; gap: 3px;
    overflow: visible;
  }
  .mini.star { border-color: #f2c14b; box-shadow: 0 0 0 1px #f2c14b; }
  .mini-top { display: flex; align-items: center; justify-content: center; gap: 2px; min-height: 22px; }
  .mini .lv { font-size: 9px; font-weight: 800; line-height: 1.1; white-space: nowrap; letter-spacing: -0.03em; }
  .mini .xp { display: block; height: 5px; width: 100%; margin: 0; background: #5c677c; flex: 0 0 5px; border-radius: 99px; overflow: hidden; }
  .mini .xp i { background: #3ddc84; display: block; height: 4px; }
  .sprite { display: block; flex: none; }
  .slot .sprite, .sticker .sprite { margin: 0 auto 4px; }
  .scene { position: relative; min-height: 100%; background:
    radial-gradient(circle at 50% 42%, transparent 36px, rgba(255,255,255,.45) 37px, transparent 39px),
    linear-gradient(90deg, transparent 49.5%, rgba(255,255,255,.55) 49.5% 50.5%, transparent 50.5%),
    repeating-linear-gradient(#1f8a45, #1f8a45 22px, #187a3d 22px 44px);
  }
  .scene-top { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; color: white; }
  .scene-score { font-size: 28px; font-weight: 900; letter-spacing: -1px; }

  function deal(list, ids, division) {
    list.forEach((p, i) => { p.club = ids[i % ids.length]; p.division = division; });
  }
  deal(commons.slice(12), clubs(0), 0);
  deal(commons.slice(0, 12).concat(uncommons.slice(8)), clubs(1), 1);

function assertData() {
  const seen = new Set();
  ROSTER.forEach(p => {
    if (seen.has(p.name_key)) throw new Error("Duplicate player " + p.name_key);
    seen.add(p.name_key);
    if (!NAME_BY_KEY[p.name_key]) throw new Error("Missing name " + p.name_key);
    if (p.base > p.ceiling) throw new Error("Base over ceiling " + p.name_key);
    const band = BANDS[p.rarity];
    if (!band || p.ceiling < band[0] || p.ceiling > band[1]) throw new Error("Ceiling band " + p.name_key);
  });
  const shorts = new Set();
  CLUB_POOLS.forEach((pool, i) => {
    const expect = [23, 23, 23, 19][i];
    if (pool.length !== expect) throw new Error("Pool size " + i);
    pool.forEach(c => {
      if (!NAME_BY_KEY[c.id]) throw new Error("Missing club " + c.id);
      if (shorts.has(c.short)) throw new Error("Short " + c.short);
      shorts.add(c.short);
    });
  });
  const posCount = { GK:0, DEF:0, MID:0, FWD:0 };
  START_XI.forEach(id => {
    const p = playerByKey(id);
    if (!p) throw new Error("Starter " + id);
    posCount[p.pos]++;
  });
  if (posCount.GK !== 1 || posCount.DEF !== 4 || posCount.MID !== 4 || posCount.FWD !== 2) {
    throw new Error("Formation");
  }
  const avg = START_XI.reduce((s, k) => s + playerByKey(k).base, 0) / 11;
  if (avg < 39.5 || avg > 41) throw new Error("Starter avg " + avg.toFixed(2));
  LEGEND_TEAMS.forEach(t => {
    if (t.xi.length !== 11) throw new Error("XI " + t.id);
    if (!NAME_BY_KEY[t.name_key]) throw new Error("team name " + t.id);

    if (t.weight !== weights[t.id]) throw new Error("weight " + t.id);
    t.xi.forEach(k => { if (!playerByKey(k)) throw new Error("legend player " + k); });
  });
}

function effectiveOf(key) {
  const p = playerByKey(key);

  const cap = league().cap;

  const ceil = p.ceiling + (o.gold ? 1 : 0);
  return Math.min(grown, ceil, cap, 99);
}

function xpToNext(rating) { return Math.round(90 + rating * 2.4); }
function grantXp(key, amount) {
  const o = state.owned[key];
  const p = playerByKey(key);
  if (!o || !p || amount <= 0) return;
  const ceil = p.ceiling + (o.gold ? 1 : 0);
  if (o.rating >= ceil) return;
  o.xp += amount;
  let guard = 0;
  while (o.rating < ceil && o.xp >= xpToNext(o.rating) && guard < 40) {
    o.xp -= xpToNext(o.rating);
    o.rating += 1;
    guard += 1;
  }

function adjustedPool(pity) {
  const pool = remainingMythics();
  if (pool.length <= 1) return pool.map(p => ({ ...p, w: p.weight, pct: pool.length ? 100 : 0 }));
  const weighted = pool.map(p => ({ ...p, w: p.weight + (pity / 100) * (30 - p.weight) * 0.45 }));
  const sum = weighted.reduce((s, p) => s + p.w, 0);
  weighted.forEach(p => { p.pct = p.w / sum * 100; });

}

  const pool = adjustedPool(pity);
  if (!pool.length) return null;
  if (pool.length === 1) return pool[0];
  let x = rnd() * pool.reduce((s, p) => s + p.w, 0);
  for (let i = 0; i < pool.length; i++) {
    x -= pool[i].w;
    if (x <= 0) return pool[i];
  }

function simulateLegend(rnd) {

    .concat(LEGEND_TEAMS.map(t => ({ id: t.id, name: nameOf(t.name_key), rating: legendRating(t) })));

  teams.forEach(t => { table[t.id] = { id: t.id, name: t.name, rating: t.rating, w:0, d:0, l:0, gf:0, ga:0 }; });
  for (let i = 0; i < teams.length; i++) {

      const H = table[teams[i].id], A = table[teams[j].id];
      H.gf += pair[0]; H.ga += pair[1]; A.gf += pair[1]; A.ga += pair[0];
      if (pair[0] > pair[1]) { H.w++; A.l++; }

function oddsFor(my, opp, home) {
  const key = my.toFixed(1) + ":" + opp + ":" + (home ? "h" : "a");
  if (oddsCache.key === key) return oddsCache;
  let w = 0, d = 0;
  const n = 220;
  for (let i = 0; i < n; i++) {
    const pair = sampleScore(my, opp, home, Math.random);
    if (pair[0] > pair[1]) w++;
    else if (pair[0] === pair[1]) d++;
  }
  oddsCache = { key, win: w / n, draw: d / n };
  return oddsCache;
}

function ratingBits(key) {
  const p = playerByKey(key);
  const o = state.owned[key];
  const cap = league().cap;
  const ceil = p.ceiling + (o && o.gold ? 1 : 0);
  if (!o) return { eff: null, ceil, note: "Ceiling " + p.ceiling, frac: 0 };
  const grown = o.rating + (o.gold ? 2 : 0);
  const eff = Math.min(grown, ceil, cap, 99);
  let note = eff + " now · ceiling " + ceil;
  if (grown > cap && cap <= ceil && eff === cap) note = eff + " capped · ceiling " + ceil;
  const frac = o.rating >= ceil ? 1 : o.xp / xpToNext(o.rating);
  return { eff, ceil, note, frac };
}

    el.textContent = left <= 0 ? "Ready" : formatRemain(left);
  });
  if (state.legend.run && !state.legend.run.revealed && Date.now() >= state.legend.run.endsAt && !state.modal) {
    openReveal();
  }
}

function onClick(e) {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "stop") return;
  if (act === "tab") {
    const tab = el.dataset.tab;
    if (tab === "squad" || tab === "collection" || tab === "gold") {
      ui.showingFresh = (state.fresh || []).slice();
      state.fresh = [];
    }
    ui.tab = tab; state.tab = tab; save(); render(); return;
  }
  if (act === "play") {
    ui.tab = "match"; state.tab = "match";
    if (state.paused) { togglePause(); return; }
    save(); render();
    if (chain === "idle" && !state.modal) queueNext();
    return;
  }
  if (act === "dismiss-chest") { dismissChest(); return; }
  if (act === "pause") { togglePause(); return; }
  if (act === "speed") { setSpeed(Number(el.dataset.speed)); return; }
  if (act === "ask-reset") { ui.sheet = { type: "reset" }; render(); return; }
  if (act === "do-reset") { doReset(); return; }
  if (act === "help") { ui.sheet = { type: "help" }; render(); return; }
  if (act === "close-sheet") { ui.sheet = null; render(); return; }
  if (act === "modal-go") { onModalGo(); return; }
  if (act === "slot") { ui.sheet = { type: "pick", index: Number(el.dataset.i) }; render(); return; }
  if (act === "pick") { setSlot(ui.sheet.index, el.dataset.id); return; }
  if (act === "best") { bestXI(); save(); render(); return; }
  if (act === "contract") { throwContract(el.dataset.id); return; }
  if (act === "boost") { buyBoost(el.dataset.kind); return; }
  if (act === "refresh") { doRefresh(); return; }
  if (act === "filter") { ui.filter = el.dataset.filter; render(); return; }
  if (act === "dex-mode") { ui.dexMode = el.dataset.mode === "gold" ? "gold" : "normal"; ui.tab = "collection"; state.tab = "collection"; save(); render(); return; }
  if (act === "legend-start") { startLegend(); return; }
  if (act === "legend-skip") { skipMorning(); return; }
  if (act === "legend-team") { ui.sheet = { type: "team", team: el.dataset.team }; render(); return; }
  if (act === "dev-finish") { devFinishSeason(); return; }
  if (act === "dev-place") { devPlace(Number(el.dataset.place)); return; }
  if (act === "skip-rest") {
    state.restUntil = Date.now() - 1;
    finishRest();
  }
}

function boot() {
  load();
  render();
  setInterval(paintClocks, 250);
  if (state.legend.run && Date.now() >= state.legend.run.endsAt) openReveal();
  else if (state.restUntil > Date.now() && state.season && state.season.phase === "league") armRest();
  else if (state.pendingChest) armChest();
  else if (!state.paused && !state.modal) queueNext();
}

document.addEventListener("click", onClick);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && ui.sheet) { ui.sheet = null; render(); }
});

window.__FC = {
  get state() { return state; },
  NAME_BY_KEY,
  ROSTER,
  xiRating,
  sampleWinRate,
  setSpeed,
  devFinishSeason,
  devPlace,
  setOverride(n) { debugOverride = n; },
  clearOverride() { debugOverride = null; },
  contractChance,
  catchChance,
  buildEvents,
  openReveal,
  startLegend,
  skipMorning,
  startSeason,
  prepareLeague,
  remainingMythics,
  adjustedPool,
  drawMythic,
  playerByKey
};

try { boot(); }
catch (err) {
  console.error(err);
  const root = document.getElementById("app");
  if (root) root.textContent = "Kick-off failed: " + err.message;
}
</script>
</body>
</html>
