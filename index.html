<style>
  :root {
    --ink: #142033;
    --muted: #5c6b7a;
    --cream: #f4f1e6;
    --card: #fffdf8;
    --line: #e4dece;
    --green: #146c3a;
    --green-d: #0e4a28;
    --gold: #f2c14b;
    --gold-ink: #3a2502;
    --navy: #102033;
    --bad: #9f2d2d;
    --font: "Avenir Next", "Segoe UI", "Trebuchet MS", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background:
      radial-gradient(900px 280px at 50% 0%, #c7ecff, transparent 70%),
      linear-gradient(#8fd0ff, #d9f3ff 200px, #3e9a52 200px, #1d6b38);
    min-height: 100dvh;
  }
  button, input { font: inherit; }
  button {
    border: 0;
    cursor: pointer;
    border-radius: 999px;
    padding: 10px 14px;
    background: var(--green);
    color: white;
    font-weight: 750;
    font-weight: 700;
    min-height: 44px;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary { background: #e7e1d4; color: var(--ink); }
  button.ghost { background: transparent; color: inherit; min-height: 36px; padding: 6px 10px; }
  button.danger { background: var(--bad); }
  button.small { min-height: 36px; padding: 6px 10px; font-size: 13px; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #app {
    width: min(520px, 100%);
    margin: 0 auto;
    min-height: 100dvh;
    background: var(--cream);
    box-shadow: 0 0 0 1px rgba(0,0,0,.05), 0 18px 50px rgba(0,0,0,.18);
    padding-bottom: calc(78px + env(safe-area-inset-bottom));
  }
  header.top {
    background: linear-gradient(180deg, #123524, #1b5c38);
    color: #f6f3ea;
    padding: 12px 12px 14px;
    position: sticky;
    top: 0;
    z-index: 15;
  }
  .idrow { display: flex; gap: 10px; align-items: center; }
  .crest {
    width: 42px; height: 48px; flex: none;
    background: linear-gradient(#ffe08a, #e0a31a);
    clip-path: polygon(50% 100%, 0 74%, 0 0, 100% 0, 100% 74%);
    display: grid; place-items: center;
    color: var(--gold-ink); font-weight: 800; font-size: 13px;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -.3px; }
  .sub { margin: 2px 0 0; font-size: 13px; color: #d5ecdc; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
  .pill {
    background: rgba(255,255,255,.14);
    border-radius: 999px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 700;
  }
  .pill.hot { background: var(--gold); color: var(--gold-ink); }
  .seg { display: inline-flex; background: rgba(0,0,0,.25); border-radius: 999px; padding: 2px; }
  .seg button { min-height: 30px; padding: 4px 10px; background: transparent; color: #f6f3ea; font-size: 12px; }
  .seg button.on { background: white; color: var(--green-d); }
  main { padding: 12px; display: grid; gap: 12px; }
  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 12px;
    box-shadow: 0 8px 24px rgba(20,32,51,.06);
  }
  .card h2 { margin: 0 0 8px; font-size: 16px; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .board {
    background: var(--navy);
    color: white;
    border-radius: 18px;
    padding: 14px;
  }
  .kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #f2c14b; font-weight: 800; }
  .score {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    align-items: center;
    margin-top: 6px;
  }
  .score .n { font-size: 42px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .score .who { font-size: 13px; font-weight: 700; margin-top: 2px; }
  .side-r { text-align: right; }
  .dash { color: #f2c14b; font-weight: 800; font-size: 34px; line-height: 1; }
  .odds { margin-top: 8px; font-size: 12px; color: #c9d4e4; }
  .printer {
    margin-top: 10px;
    background: #07140e;
    color: #b7f7c8;
    font-family: var(--mono);
    border-radius: 12px;
    min-height: 148px;
    max-height: 210px;
    overflow: auto;
    padding: 10px 12px;
    font-size: 13.5px;
    line-height: 1.45;
  }
  .printer .us { color: #8dffb0; font-weight: 700; }
  .printer .them { color: #ffb4b4; font-weight: 700; }
  .printer .ft { color: #ffe08a; }
  .blink {
    display: inline-block; width: 8px; height: 13px; background: #b7f7c8;
    margin-left: 4px; vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .form { display: flex; gap: 4px; margin-top: 8px; }
  .form i {
    width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
    font-style: normal; font-size: 11px; font-weight: 800; color: white;
  }
  .form .W { background: #1f8a4c; }
  .form .D { background: #c2880c; }
  .form .L { background: #b42318; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 4px; text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-size: 11px; font-weight: 700; }
  td.club, th.club { text-align: left; white-space: normal; }
  tr.us td { background: #e5f6ea; font-weight: 700; }
  .gdpos { color: #1f8a4c; }
  .gdneg { color: #b42318; }
  .table-wrap { overflow-x: auto; }
  .pitch {
    background: repeating-linear-gradient(90deg, #1f8a45 0 26px, #18763b 26px 52px);
    border-radius: 18px;
    padding: 10px 8px 14px;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.35);
  }
  .prow { display: flex; gap: 6px; justify-content: center; margin: 6px 0; }
  .slot {
    background: rgba(255,255,255,.95);
    border: 0;
    border-radius: 12px;
    min-height: 62px;
    padding: 4px;
    color: var(--ink);
    text-align: center;
    position: relative;
  }
  .prow.fwd .slot { flex: 0 1 46%; }
  .prow.mid .slot, .prow.def .slot { flex: 1 1 0; }
  .prow.gk { justify-content: center; }
  .prow.gk .slot { flex: 0 1 46%; }
  .slot .pos { font-size: 9px; letter-spacing: .08em; color: var(--muted); font-weight: 800; }
  .slot .rt { font-size: 16px; font-weight: 800; line-height: 1.1; }
  .slot .nm { font-size: 10px; line-height: 1.15; font-weight: 700; overflow-wrap: anywhere; }
  .slot.gold { box-shadow: inset 0 0 0 2px #e0a31a; background: linear-gradient(#fff, #fff6d8); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border-radius: 999px; padding: 6px 10px; min-height: 34px;
    background: #e7e1d4; color: var(--ink); font-size: 12px; font-weight: 700;
  }
  .chip.on { background: var(--green); color: white; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 480px) {
    .stickers { grid-template-columns: repeat(3, 1fr); }
  }
  .pcard {
    background: white; border-radius: 14px; padding: 10px;
    border: 2px solid var(--line); text-align: left; color: inherit; width: 100%;
  }
  .pcard .top { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
  .pcard .rt { font-size: 22px; font-weight: 800; }
  .pcard .nm { font-weight: 800; font-size: 14px; }
  .tag { font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  .goldtag { color: #8a6508; }
  .bar { height: 6px; background: #efe8d6; border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar span { display: block; height: 100%; background: var(--green); }
  .uncaught { opacity: .55; filter: grayscale(.35); }
  .stickers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sticker {
    background: white; border-radius: 12px; min-height: 92px; padding: 8px;
    border: 2px solid var(--line); font-size: 12px;
  }
  .sticker b { display: block; font-size: 12px; line-height: 1.25; }
  .banner {
    border-radius: 14px; padding: 10px 12px; background: #e7f6ec; font-weight: 700;
  }
  .banner.bad { background: #fde8e8; }
  .banner.gold { background: linear-gradient(#fff6d0, #ffe08a); }
  .exact { font-size: 18px; margin: 0 0 4px; }
  .tabs {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: min(520px, 100%);
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: #fffdf8; border-top: 1px solid var(--line);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .tabs button {
    background: transparent; color: var(--muted); border-radius: 12px;
    padding: 6px 2px; font-size: 11px; min-height: 46px; line-height: 1.15;
  }
  .tabs button.on { background: var(--green); color: white; }
  .backdrop, .modal-back {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(10, 20, 16, .62);
    display: grid; place-items: end center;
    padding: 12px;
  }
  .modal-back { place-items: center; }
  .sheet, .modal {
    width: min(480px, 100%);
    background: var(--card);
    border-radius: 22px 22px 16px 16px;
    padding: 16px;
    max-height: min(78dvh, 640px);
    overflow: auto;
    position: relative;
  }
  .modal { text-align: center; border-radius: 22px; }
  .modal.big { background: radial-gradient(circle at 50% 0%, #ffe7a3, #fffdf8 58%); }
  .modal h2 { font-size: 32px; line-height: 1.05; margin: 0 0 8px; letter-spacing: -.4px; }
  .list { display: grid; gap: 8px; }
  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti i {
    position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px;
    animation: fall 1.6s linear infinite;
  }
  @keyframes fall { to { transform: translateY(70vh) rotate(180deg); } }
  details { font-size: 13px; }
  summary { cursor: pointer; font-weight: 700; }
  .warn { background: #fff4d6; border-radius: 12px; padding: 8px 10px; font-size: 13px; }
  .meter { height: 10px; background: #efe8d6; border-radius: 99px; overflow: hidden; }
  .meter span { display: block; height: 100%; background: linear-gradient(90deg, #e0a31a, #f2c14b); }
  @media (max-width: 380px) {
    .hide-sm { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blink, .confetti i { animation: none; }
  }

function assertData() {
  const seen = new Set();
  ROSTER.forEach(p => {
    if (seen.has(p.name_key)) throw new Error("Duplicate player " + p.name_key);
    seen.add(p.name_key);
    if (!NAME_BY_KEY[p.name_key]) throw new Error("Missing name " + p.name_key);
    if (p.base > p.ceiling) throw new Error("Base over ceiling " + p.name_key);
    const band = BANDS[p.rarity];
    if (!band || p.ceiling < band[0] || p.ceiling > band[1]) throw new Error("Ceiling band " + p.name_key);
  });
  const shorts = new Set();
  CLUB_POOLS.forEach((pool, i) => {
    const expect = [23, 24, 24, 19][i];
    if (pool.length !== expect) throw new Error("Pool size " + i);
    pool.forEach(c => {
      if (!NAME_BY_KEY[c.id]) throw new Error("Missing club " + c.id);
      if (shorts.has(c.short)) throw new Error("Short " + c.short);
      shorts.add(c.short);
    });
  });
  const posCount = { GK:0, DEF:0, MID:0, FWD:0 };
  START_XI.forEach(id => {
    const p = playerByKey(id);
    if (!p) throw new Error("Starter " + id);
    posCount[p.pos]++;
  });
  if (posCount.GK !== 1 || posCount.DEF !== 4 || posCount.MID !== 4 || posCount.FWD !== 2) {
    throw new Error("Formation");
  }
  const avg = START_XI.reduce((s, k) => s + playerByKey(k).base, 0) / 11;
  if (avg < 39.5 || avg > 41) throw new Error("Starter avg " + avg.toFixed(2));
  LEGEND_TEAMS.forEach(t => {
    if (t.xi.length !== 11) throw new Error("XI " + t.id);
    if (!NAME_BY_KEY[t.name_key]) throw new Error("team name " + t.id);
    const weights = { gerrard:30, lampard:20, terry:15, ferdinand:15, henry:10, shearer:10 };
    if (t.weight !== weights[t.id]) throw new Error("weight " + t.id);
    t.xi.forEach(k => { if (!playerByKey(k)) throw new Error("legend player " + k); });
  });
}

function effectiveOf(key) {
  const p = playerByKey(key);
  const o = state.owned[key];
  if (!p || !o) return 30;
  const cap = league().cap;
  const grown = o.rating + (o.gold ? 2 : 0);
  const ceil = p.ceiling + (o.gold ? 1 : 0);
  return Math.min(grown, ceil, cap, 99);
}

function xpToNext(rating) { return Math.round(90 + rating * 2.4); }
function grantXp(key, amount) {
  const o = state.owned[key];
  const p = playerByKey(key);
  if (!o || !p || amount <= 0) return;
  const ceil = p.ceiling + (o.gold ? 1 : 0);
  if (o.rating >= ceil) return;
  o.xp += amount;
  let guard = 0;
  while (o.rating < ceil && o.xp >= xpToNext(o.rating) && guard < 40) {
    o.xp -= xpToNext(o.rating);
    o.rating += 1;
    guard += 1;
  }
  if (o.rating >= ceil) o.xp = 0;

function remainingMythics() {
  return LEGEND_TEAMS.filter(t => !state.legend.signed.includes(t.headline) && !state.owned[t.headline])
    .map(t => ({ key: t.headline, weight: t.weight, team: t.id }));

function adjustedPool(pity) {
  const pool = remainingMythics();
  if (pool.length <= 1) return pool.map(p => ({ ...p, w: p.weight, pct: pool.length ? 100 : 0 }));
  const weighted = pool.map(p => ({ ...p, w: p.weight + (pity / 100) * (30 - p.weight) * 0.45 }));
  const sum = weighted.reduce((s, p) => s + p.w, 0);
  weighted.forEach(p => { p.pct = p.w / sum * 100; });
  return weighted;
}
function drawMythic(rnd, pity) {
  const pool = adjustedPool(pity);
  if (!pool.length) return null;
  if (pool.length === 1) return pool[0];
  let x = rnd() * pool.reduce((s, p) => s + p.w, 0);
  for (let i = 0; i < pool.length; i++) {
    x -= pool[i].w;
    if (x <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}
function pullTeammate(deck, rnd) {
  const options = ROSTER.filter(p => p.rarity === "teammate" && !state.owned[p.name_key] && (!deck || deckOf(p) === deck));
  if (!options.length) {
    state.xi.forEach(k => grantXp(k, 24));
    return { empty: true };
  }
  const p = options[Math.floor(rnd() * options.length)];
  ownPlayer(p, false);

}
function simulateLegend(rnd) {
  const teams = [{ id: "user", name: NAME_BY_KEY.club_josh, rating: xiRating() }]
    .concat(LEGEND_TEAMS.map(t => ({ id: t.id, name: nameOf(t.name_key), rating: legendRating(t) })));
  const table = {};
  teams.forEach(t => { table[t.id] = { id: t.id, name: t.name, rating: t.rating, w:0, d:0, l:0, gf:0, ga:0 }; });
  for (let i = 0; i < teams.length; i++) {
    for (let j = i + 1; j < teams.length; j++) {
      const pair = sampleScore(teams[i].rating, teams[j].rating, true, rnd);
      const H = table[teams[i].id], A = table[teams[j].id];
      H.gf += pair[0]; H.ga += pair[1]; A.gf += pair[1]; A.ga += pair[0];
      if (pair[0] > pair[1]) { H.w++; A.l++; }
      else if (pair[0] < pair[1]) { A.w++; H.l++; }
      else { H.d++; A.d++; }
    }
  }
  return Object.keys(table).map(id => {
    const t = table[id];
    return { ...t, pts: t.w * 3 + t.d, gd: t.gf - t.ga, p: t.w + t.d + t.l };
  }).sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || b.rating - a.rating || a.name.localeCompare(b.name));
}
function startLegend() {

  state.tokens -= 1;

function applyPrize(prize, rnd) {

  if (prize.kind === "sign") {
    ownPlayer(playerByKey(prize.legendKey), false);
    state.pity = 0;
    pushFeed(nameOf(prize.legendKey) + " signs for Josh United.");
  } else if (prize.kind === "miss") {

    const mate = pullTeammate(prize.deck, rnd);
    prize.mateKey = mate.key || null;
    prize.mateEmpty = !!mate.empty;
    pushFeed("He's just not interested");
  } else if (prize.kind === "gold") {

    state.stats.golds += 1;
    pushFeed("A gold " + nameOf(prize.legendKey) + ".");

function computePrize(table, rnd) {
  const place = table.findIndex(r => r.id === "user") + 1;
  const cash = [0, 8000, 4000, 3000, 2000, 1500, 1000, 800][place] || 800;
  if (place === 1) {
    const pool = remainingMythics();
    if (!pool.length) {
      const hit = rnd() < 1 / GOLD_ODDS;
      if (!hit) return { place, cash, kind: "gold-miss" };
      const myths = LEGEND_TEAMS.map(t => t.headline).filter(k => state.owned[k] && !state.owned[k].gold);
      if (!myths.length) return { place, cash, kind: "gold-all" };
      return { place, cash, kind: "gold", legendKey: myths[Math.floor(rnd() * myths.length)] };
    }
    const drawn = drawMythic(rnd, state.pity);
    const guaranteed = state.pity >= 100;
    const offer = state.boosts.offer ? 0.15 : 0;
    const chance = guaranteed ? 1 : Math.min(0.99, 0.90 + offer);
    const success = guaranteed || rnd() < chance;
    if (!success) {
      return { place, cash, kind: "miss", legendKey: drawn.key, deck: drawn.team, usedOffer: !guaranteed && !!state.boosts.offer };
    }
    return { place, cash, kind: "sign", legendKey: drawn.key, guaranteed, usedOffer: !guaranteed && !!state.boosts.offer };
  }
  if (place === 2) return { place, cash, kind: "second" };
  return { place, cash, kind: "minor" };
}

function oddsFor(my, opp, home) {
  const key = my.toFixed(1) + ":" + opp + ":" + (home ? "h" : "a");
  if (oddsCache.key === key) return oddsCache;
  let w = 0, d = 0;
  const n = 220;
  for (let i = 0; i < n; i++) {
    const pair = sampleScore(my, opp, home, Math.random);
    if (pair[0] > pair[1]) w++;
    else if (pair[0] === pair[1]) d++;
  }
  oddsCache = { key, win: w / n, draw: d / n };
  return oddsCache;
}

  if (!state.season || state.season.phase !== "league") return null;

function ratingBits(key) {

  const grown = o.rating + (o.gold ? 2 : 0);
  const eff = Math.min(grown, ceil, cap, 99);
  let note = eff + " now · ceiling " + ceil;
  if (grown > cap && cap <= ceil && eff === cap) note = eff + " capped · ceiling " + ceil;
  const frac = o.rating >= ceil ? 1 : o.xp / xpToNext(o.rating);
  return { eff, ceil, note, frac };
}

  const act = el.dataset.act;
  if (act === "stop") return;
  if (act === "tab") { ui.tab = el.dataset.tab; state.tab = ui.tab; save(); render(); return; }
  if (act === "pause") { togglePause(); return; }
  if (act === "speed") { setSpeed(Number(el.dataset.speed)); return; }
  if (act === "ask-reset") { ui.sheet = { type: "reset" }; render(); return; }
  if (act === "do-reset") { doReset(); return; }
  if (act === "help") { ui.sheet = { type: "help" }; render(); return; }
  if (act === "close-sheet") { ui.sheet = null; render(); return; }
  if (act === "modal-go") { onModalGo(); return; }
  if (act === "slot") { ui.sheet = { type: "pick", index: Number(el.dataset.i) }; render(); return; }
  if (act === "pick") { setSlot(ui.sheet.index, el.dataset.id); return; }
  if (act === "best") { bestXI(); save(); render(); return; }
  if (act === "contract") { throwContract(el.dataset.id); return; }
  if (act === "boost") { buyBoost(el.dataset.kind); return; }
  if (act === "refresh") { doRefresh(); return; }
  if (act === "filter") { ui.filter = el.dataset.filter; render(); return; }
  if (act === "legend-start") { startLegend(); return; }
  if (act === "legend-skip") { skipMorning(); return; }
  if (act === "legend-team") { ui.sheet = { type: "team", team: el.dataset.team }; render(); return; }
  if (act === "dev-finish") { devFinishSeason(); return; }
  if (act === "dev-place") { devPlace(Number(el.dataset.place)); return; }
  if (act === "skip-rest") {
    state.restUntil = Date.now() - 1;
    finishRest();
  }
}

function boot() {
  load();
  render();
  setInterval(paintClocks, 250);
  if (state.legend.run && Date.now() >= state.legend.run.endsAt) openReveal();
  else if (state.restUntil > Date.now() && state.season && state.season.phase === "league") armRest();
  else if (state.pendingChest) {
    chain = "chest";
    render();
    wait(1200, () => {
      state.pendingChest = null;
      chain = "idle";
      save();
      render();
      if (!state.paused && !state.modal) afterMatchFlow();
    });
  } else if (!state.paused && !state.modal) queueNext();
}

document.addEventListener("click", onClick);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && ui.sheet) { ui.sheet = null; render(); }
});

window.__FC = {
  get state() { return state; },
  NAME_BY_KEY,
  ROSTER,
  xiRating,
  sampleWinRate,
  setSpeed,
  devFinishSeason,
  devPlace,
  setOverride(n) { debugOverride = n; },
  clearOverride() { debugOverride = null; },
  contractChance,
  catchChance,
  buildEvents,
  openReveal,
  startLegend,
  skipMorning,
  startSeason,
  prepareLeague,
  remainingMythics,
  adjustedPool,
  drawMythic,
  playerByKey
};

try { boot(); }
catch (err) {
  console.error(err);
  const root = document.getElementById("app");
  if (root) root.textContent = "Kick-off failed: " + err.message;
}
</script>
</body>
</html>
